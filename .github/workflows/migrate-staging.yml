name: migrate-staging

# Applies pending Prisma migrations to the staging database on every merge to main that changes
# the schema or migrations. Uses the session pooler (DIRECT_URL) from the `staging` environment.
on:
  push:
    branches: [main]
    paths:
      - 'packages/core/prisma/**'
      - 'packages/core/prisma.config.ts'
      - '.github/workflows/migrate-staging.yml'
  workflow_dispatch:

concurrency:
  group: migrate-staging
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Apply migrations
        run: npm run db:deploy -w @lc/core
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
      # `prisma migrate status` exits 1 while migrations are pending, so it can only run AFTER
      # deploy, where a non-zero exit means the database still does not match prisma/migrations.
      - name: Verify database matches migrations
        run: npm run db:status -w @lc/core
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
